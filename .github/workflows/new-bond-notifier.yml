name: New bond notifier

on:
  schedule:
    - cron: "30 9 * * *"
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      send_test_email:
        description: Send an SMTP configuration test email
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: new-bond-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -v
      - name: Check subscriptions and notify
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SEND_TEST_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_email }}
        run: python -m new_bond_notifier
